services:
  mcp-sandbox:
    build: .
    environment:
      KILNTAINERS_AUTH_TOKEN: ${KILNTAINERS_AUTH_TOKEN:?Set a random owner bearer token of at least 32 bytes}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 60s
    restart: unless-stopped
