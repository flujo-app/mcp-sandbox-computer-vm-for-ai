name: Format and Lint
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format_and_lint:
    name: Format, lint, types and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          python-version: "3.13"
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check src scripts/smoke-package.py
      - run: uv run --frozen ty check
      - run: node scripts/sync-version.mjs --check
